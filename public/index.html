<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VECTOR — Voice ATC Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@62.5..125,400..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060B12; --console:#0E1724; --console2:#152133; --well:#0A111B; --rule:#22334A; --rule2:#33486A;
  --text:#E7EEF7; --text2:#C3D0DF; --dim:#93A6BD; --faint:#64788F;
  --tx:#4FD1FF; --ok:#6FE3A1; --warn:#FFB020; --bad:#FF5A4F;
  --paper:#ECE5CE; --paper2:#DFD7BC; --pink:#18212C; --dep:#4C8DF0; --arr:#E3A53A;
  --mono:Inconsolata,ui-monospace,Consolas,monospace;
  --sans:Inconsolata,ui-monospace,Consolas,monospace;
  --cond:Inconsolata,ui-monospace,Consolas,monospace;
  --hand:Caveat,'Segoe Print','Bradley Hand',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
#app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(#131F30,#0E1724);border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 var(--rule);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:19px}
.fac{display:flex;align-items:baseline;gap:8px;white-space:nowrap;padding-left:14px;border-left:1px solid var(--rule)}
.fac b{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.04em}
.fac span{font-size:13px;color:var(--dim)}
#netDot{width:8px;height:8px;border-radius:50%;background:var(--faint);align-self:center;display:none}
#netDot.live{display:block;background:var(--ok);}
#netDot.wait{display:block;background:var(--warn)}
#atis{flex:1;min-width:0;height:34px;display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:12px;color:#B9F3CF;background:var(--well);border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 1px 0 var(--rule);white-space:pre;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;gap:2px;background:var(--well);border:1px solid #000;border-radius:7px;padding:3px;box-shadow:0 1px 0 var(--rule)}
.speed button{min-width:38px;height:30px;border:none;border-radius:5px;background:transparent;color:var(--dim);font-family:var(--mono);font-size:12px;font-weight:600}
.speed button.on{background:var(--console2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
#clock{font-family:var(--mono);font-size:18px;font-weight:600;white-space:nowrap;color:var(--text)}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.score span{font-family:var(--cond);font-size:12px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.score b{font-family:var(--mono);font-size:16px}
.tbtn{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--rule2);background:var(--console2);color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.tbtn:hover{background:#1B2B43;color:var(--text)}
.tbtn.end{border-color:#5A2C2C;color:#FFC4BE}

/* ---------- layout ---------- */
#main{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0}
#left{display:grid;grid-template-rows:minmax(0,1fr) 250px;min-width:0;min-height:0}
#scopeWrap{position:relative;min-height:0;background:#04080D}
#scope{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.viewbar{position:absolute;left:12px;top:12px;display:flex;gap:2px;background:rgba(8,14,22,.9);border:1px solid var(--rule);border-radius:7px;padding:3px}
.viewbar button{height:30px;padding:0 12px;border-radius:5px;border:none;background:transparent;color:var(--dim);font-size:12.5px;font-weight:600}
.viewbar button.on{background:var(--console2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
.legend{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--faint);background:rgba(6,11,18,.7);padding:4px 8px;border-radius:5px;pointer-events:none}
#toasts{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 10px;border-radius:5px;background:rgba(10,17,27,.94);border:1px solid var(--rule2);animation:tin .2s ease-out}
.toast.good{color:var(--ok);border-color:#235C40}.toast.bad{color:#FFC4BE;border-color:#6B2A26}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#paused{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--warn);background:rgba(40,28,8,.92);border:1px solid #6B4B1A;padding:5px 10px;border-radius:5px;display:none;white-space:nowrap}

/* ---------- comm console ---------- */
#bottom{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr) minmax(220px,280px);min-height:0;background:var(--console);border-top:1px solid #000;box-shadow:inset 0 1px 0 var(--rule)}
#coach{padding:12px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch .k,.ph{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ch .k{color:var(--warn)}
.lvl{font-size:11px;color:var(--dim);border:1px solid var(--rule2);padding:1px 7px;border-radius:999px;white-space:nowrap}
.ctitle{font-size:14.5px;font-weight:600}.ctitle .cs{font-family:var(--mono);color:var(--tx)}
.phrase{font-family:var(--mono);font-size:13px;line-height:19px;background:var(--well);border:1px solid #000;border-left:3px solid var(--tx);border-radius:4px;padding:8px 10px;color:var(--text)}
.phrase .blank{color:var(--warn)}
.sayit{font-size:12.5px;color:var(--text2);font-style:italic;line-height:17px}
.why{font-size:12.5px;color:var(--dim);line-height:17px}
.crow{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{height:30px;padding:0 10px;border-radius:5px;border:1px solid var(--rule2);background:var(--console2);color:var(--text2);font-size:12px;font-weight:600}
.cbtn:hover{background:#1B2B43}
#logWrap{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);background:var(--well)}
.ph{padding:10px 14px 6px}
#log{flex:1;overflow-y:auto;padding:0 14px 10px;display:flex;flex-direction:column;gap:3px}
.lm{display:grid;grid-template-columns:58px 64px minmax(0,1fr);gap:8px;font-size:13px;line-height:18px;align-items:baseline}
.lm .t{font-family:var(--mono);font-size:11px;color:var(--faint)}
.lm .w{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm.atc .w{color:var(--tx)}.lm.atc .x{color:var(--text)}
.lm.ai .w{color:#8FB2D9}.lm.ai .x{color:var(--text2)}
.lm.pilot .w{color:var(--ok)}.lm.pilot .x{color:var(--text2)}
.lm.dim{opacity:.55}
.lm.alert .w{color:var(--bad)}.lm.alert .x{color:#FFC4BE}
.lm.tip .w{color:var(--warn)}.lm.tip .x{color:#F5DDA9}
.lm.sys .w{color:var(--faint)}.lm.sys .x{color:var(--dim)}
#ptt{padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:0}
#freqDisp{display:flex;align-items:baseline;justify-content:space-between;gap:8px;height:38px;padding:0 10px;background:#070C08;border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 6px rgba(0,0,0,.9),0 1px 0 var(--rule);align-items:center}
#freqDisp b{font-family:var(--mono);font-size:20px;font-weight:600;color:#FFB84A;letter-spacing:.04em}
#freqDisp span{font-family:var(--cond);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#C98F38}
#pttBtn{flex:1;min-height:64px;border-radius:10px;border:1px solid #000;background:linear-gradient(#1B2A40,#121D2E);box-shadow:inset 0 1px 0 #34496A,0 2px 0 #000;color:var(--tx);display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.1em;user-select:none;-webkit-user-select:none;touch-action:none;position:relative}
#pttBtn::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:#3A2222;box-shadow:inset 0 0 0 1px #000}
#pttBtn.on{background:linear-gradient(#FF6A5E,#D8362B);color:#fff;transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 5px rgba(255,90,79,.18)}
#pttBtn.on::after{background:#fff;box-shadow:0 0 10px #fff}
#interim{font-size:12.5px;line-height:17px;color:var(--text2);min-height:34px;max-height:52px;overflow:hidden}
#interim .m{color:var(--faint)}
#txInput{width:100%;height:38px;border-radius:6px;border:1px solid var(--rule2);background:var(--well);color:var(--text);padding:0 10px;font-size:13px;font-family:var(--sans)}
#txInput::placeholder{color:var(--faint)}

/* ---------- strip bay ---------- */
#strips{background:#0A111B;display:flex;flex-direction:column;min-height:0;overflow-y:auto;border-left:1px solid #000;box-shadow:inset 1px 0 0 var(--rule)}
.gh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 7px;position:sticky;top:0;background:#0A111B;z-index:1;border-bottom:1px solid var(--rule)}
.gh b{font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.gh span{font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:7px}
.gh .who{font-family:var(--sans);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:3px}
.gh .who.you{background:var(--ok);color:#06200F}.gh .who.ai{background:#1D2A3D;color:var(--dim)}
.gl{display:flex;flex-direction:column;gap:5px;padding:8px 10px 12px;background:repeating-linear-gradient(#0D1622 0 53px,#0A111B 53px 58px)}
.empty{font-size:12px;color:var(--faint);padding:2px 2px 4px}
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 9px 6px 12px;border-radius:2px;background:var(--paper);border:none;border-left:7px solid var(--dep);text-align:left;color:var(--pink);width:100%;font-family:var(--mono);box-shadow:0 1px 0 #000,0 2px 5px rgba(0,0,0,.45)}
.strip.arr{border-left-color:var(--arr)}
.strip.ai{background:#9FA59F;opacity:.62}
.strip.req{background:#FBEFA0}
.strip.sel{outline:2px solid var(--tx);outline-offset:1px}
.strip.emg{border-left-color:var(--bad)}
.strip .cs{font-size:15px;font-weight:700;display:flex;gap:7px;align-items:baseline;letter-spacing:.01em}
.strip .cs i{font-style:normal;font-size:11px;font-weight:500;color:#505C68}
.strip .st{font-size:11px;color:#3B4651;grid-column:1;font-family:var(--sans);font-weight:500}
.strip .rt{font-size:11px;color:#3B4651;text-align:right;white-space:nowrap}
.strip .rq{font-family:var(--sans);font-size:11px;font-weight:700;color:#9A4B00;text-align:right;white-space:nowrap}
.strip .rq.late{color:#C4221A}
.tag{font-family:var(--sans);font-size:9.5px;font-weight:700;padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:13px}
.tag.v{color:#5B3FA8}.tag.e{color:#C4221A;background:#FFE1DD}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(3,6,10,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto}
#overlay.hide{display:none}
.modal{width:min(1000px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--console);border:1px solid var(--rule2);border-radius:10px;padding:0 30px 26px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:24px;align-items:center;margin:0 -30px;padding:26px 30px 22px;background:radial-gradient(120% 160% at 100% 50%,#12283A 0,#0E1724 60%);border-bottom:1px solid var(--rule)}
.hero h1{margin:0 0 14px;font-family:var(--cond);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:.01em}
.hero p{max-width:60ch}
.dial{width:170px;height:170px;border-radius:50%;position:relative;background:radial-gradient(circle,#0B1B22 0,#050B10 70%);border:1px solid #1E3A44;overflow:hidden}
.dial::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 20px,rgba(111,227,161,.16) 20px 21px)}
.dial::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 78%,rgba(111,227,161,.38) 100%);animation:sweep 4.8s linear infinite}
.dial i{position:absolute;width:5px;height:5px;border-radius:50%;background:#B9F3CF;box-shadow:0 0 8px #6FE3A1}
@keyframes sweep{to{transform:rotate(360deg)}}
.modal h1{margin:0;font-family:var(--cond);font-size:44px;font-weight:700}
.modal h2{margin:0 0 10px;font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.modal p{margin:0;color:var(--text2);line-height:1.55;font-size:14.5px}
.modal p.sm{font-size:13px;color:var(--dim);margin-top:8px;max-width:95ch}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:6px;background:var(--console2);border:1px solid var(--rule);cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--ok);background:#12281F}
.opt:has(input:focus-visible){outline:2px solid var(--tx);outline-offset:2px}
.opt b{font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.02em}.opt .f{font-family:var(--mono);font-size:12px;color:#FFB84A}.opt span{font-size:13px;color:var(--text2);line-height:17px}
.opt .chk{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--rule2)}
.opt:has(input:checked) .chk{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px #12281F}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.seg{display:flex;gap:3px;background:var(--well);border:1px solid #000;border-radius:7px;padding:3px;box-shadow:0 1px 0 var(--rule)}
.seg label{flex:1;text-align:center;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:13.5px;font-weight:600;color:var(--dim);cursor:pointer;position:relative;white-space:nowrap;padding:0 6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--console2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
.seg label:has(input:focus-visible){outline:2px solid var(--tx)}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px}
.toggles label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--rule)}
.toggles input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.wxsel{margin-top:8px;width:100%;height:34px;border:1px solid var(--rule2);border-radius:6px;background:var(--well);color:var(--text);font:inherit;font-size:13px;padding:0 8px}
.wxlive{margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.35;word-break:break-word}
.sitpick select{height:30px;max-width:62%;border:1px solid var(--rule);border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:13px}.sitpick select option{color:#111}
.go{height:52px;padding:0 34px;border:none;border-radius:8px;background:var(--ok);color:#06200F;font-family:var(--cond);font-size:21px;font-weight:700;letter-spacing:.06em}
.go:hover{background:#8BEDB6}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--rule)}
.keys{font-size:13px;color:var(--text2);line-height:1.8}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule2);border-bottom-width:2px;padding:0 5px;border-radius:4px;color:var(--text);background:var(--console2)}
.mic{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:6px;background:var(--console2);border:1px solid var(--rule)}
.stat span{display:block;font-size:12.5px;color:var(--dim)}.stat b{font-family:var(--mono);font-size:24px;font-weight:600}
.note{font-size:13px;color:#F5DDA9;background:#241B08;border:1px solid #6B4B1A;padding:8px 12px;border-radius:6px;line-height:1.5}
.vrow{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.vrow input:not([type=checkbox]){height:40px;border-radius:6px;border:1px solid var(--rule2);background:var(--well);color:#FFB84A;padding:0 10px;font-family:var(--mono);font-size:16px;font-weight:600;text-transform:uppercase}
.chkrow{flex-direction:row;align-items:center;gap:10px;font-size:13.5px;color:var(--text2);padding-top:24px}
.chkrow input{width:20px;height:20px;accent-color:var(--ok);flex:none}
#mtabs{display:none}

@media (max-width:1100px){
  #main{grid-template-columns:minmax(0,1fr) 300px}
  #atis{display:none}.fac{flex:1}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}.row3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chkrow{padding-top:0}
}
@media (max-width:700px){
  #app{grid-template-rows:auto minmax(0,1fr)}
  #top{gap:7px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;overflow:hidden}
  .bname,.fac,#atis,.score{display:none}
  .brand svg{width:22px;height:22px}
  .speed{padding:2px;margin-right:auto}.speed button{min-width:31px;height:30px;font-size:11px}
  .speed button[data-s="8"]{display:none}
  #clock{font-size:12.5px}
  .tbtn{height:32px;padding:0 9px;font-size:12px}
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,31%) auto;grid-template-areas:"scope" "tabs" "panel" "ptt"}
  #left,#bottom{display:contents}
  #scopeWrap{grid-area:scope;min-height:200px}
  #mtabs{grid-area:tabs;display:flex;gap:3px;padding:5px 8px;background:var(--console);border-top:1px solid #000;border-bottom:1px solid var(--rule)}
  #mtabs button{flex:1;height:36px;border-radius:5px;border:none;background:transparent;color:var(--dim);font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  #mtabs button.on{background:var(--console2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
  #coach,#logWrap,#strips{grid-area:panel;display:none;border:none;box-shadow:none;min-height:0;overflow-y:auto}
  body[data-mtab=coach] #coach{display:flex;background:var(--console)}
  body[data-mtab=log] #logWrap{display:flex}
  body[data-mtab=strips] #strips{display:flex}
  .lm{grid-template-columns:52px minmax(0,1fr)}.lm .t{display:none}
  #ptt{grid-area:ptt;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"btn frq" "btn int" "btn form";gap:5px 10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--console);border-top:1px solid #000;box-shadow:inset 0 1px 0 var(--rule)}
  #pttBtn{grid-area:btn;width:98px;min-height:104px;flex-direction:column;gap:5px;font-size:14px;letter-spacing:.05em;padding:6px;text-align:center;line-height:1.1}
  #freqDisp{grid-area:frq;height:28px}#freqDisp b{font-size:15px}#freqDisp span{font-size:12px}
  #interim{grid-area:int;min-height:0;max-height:48px;font-size:12px;line-height:16px}
  #txForm{grid-area:form}
  #txInput{height:38px;font-size:16px}
  .viewbar{left:8px;top:auto;bottom:8px}
  .viewbar button{height:30px;padding:0 9px;font-size:12px}
  #paused{bottom:auto;top:8px;font-size:11px}
  .legend{display:none}
  #toasts{right:8px;top:8px}
  .modal{padding:0 16px 18px;gap:16px;border-radius:8px;max-height:none}
  .hero{grid-template-columns:minmax(0,1fr) 74px;gap:12px;margin:0 -16px;padding:18px 16px 16px}
  .hero h1{font-size:36px}
  .dial{width:74px;height:74px}
  .modal h1{font-size:34px}
  .row3{gap:14px}
  .toggles{grid-template-columns:1fr}
  .keys{display:none}
  .go{width:100%}
  #overlay{padding:8px;align-items:flex-start}
}

/* ================= theme: flat, quiet, professional =================
   One accent (blue) for selection and primary actions; green, amber and red only for status.
   No glows, no text shadows, no gradients on controls. */
:root{
  --ink:#0A0E13;--console:#10151C;--console2:#171D26;--well:#0C1117;--rule:#212A35;--rule2:#2D3846;
  --text:#E7EBF0;--text2:#B4BDC9;--dim:#8A95A3;--faint:#647080;
  --tx:#5AA2FF;--ok:#3FBF7F;--warn:#E3A33A;--bad:#E5534B;--dep:#5AA2FF;--arr:#3FBF7F;
  --red:var(--bad);--green:var(--ok);--muted:var(--dim);--muted2:var(--faint);
  --acc:#2F7CF6;--acc2:#4A8FF8;--card:#131921;--card2:#19202A;
}
body{background:var(--ink)}
#top{background:var(--console);border-bottom:1px solid var(--rule);box-shadow:none;position:relative;z-index:4}
.brand{color:var(--text);font-family:var(--sans);font-weight:700;letter-spacing:.16em;font-size:15px}.brand svg{stroke:var(--tx)}
.fac{border-left-color:var(--rule)}
.fac b{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--text)}
#netDot.live{box-shadow:none}
#atis{color:#BFD9C9;background:var(--well);border:1px solid var(--rule);border-radius:6px;box-shadow:none}
#clock{font-size:16px;color:var(--text)}
.score b{font-size:16px;color:var(--text);display:inline-block}
.score span{color:var(--faint)}
.score b.bump{animation:bump .35s}
@keyframes bump{40%{color:var(--ok)}}
.speed,.viewbar{background:var(--well);border:1px solid var(--rule);border-radius:7px;box-shadow:none}
.speed button.on,.viewbar button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
.speed button:hover:not(.on),.viewbar button:hover:not(.on){color:var(--text)}
.viewbar{background:rgba(12,17,23,.94)}
.viewbar .vsep{width:1px;margin:5px 3px;background:var(--rule2)}
#mapBtn.on{color:#fff;background:var(--acc);box-shadow:none}
.viewbar,#toasts,#paused,.legend,#osmCredit{z-index:3}
.tbtn{background:var(--card2);border:1px solid var(--rule2);border-radius:6px;color:var(--text2)}
.tbtn:hover{background:#202834;color:var(--text)}
.tbtn.end{border-color:var(--rule2);color:var(--text2)}
#osmCredit{position:absolute;left:12px;bottom:10px;font-size:11px;color:#3A4350;background:rgba(255,255,255,.86);padding:3px 8px;border-radius:4px}
#osmCredit a{color:#1F5FBF;text-decoration:none}#osmCredit a:hover{text-decoration:underline}
.legend{background:rgba(12,17,23,.8);color:var(--dim)}
#scopeWrap::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0}
#scopeWrap.alarm::before{box-shadow:inset 0 0 0 3px var(--bad);animation:alarm 1.3s ease-out}
#scopeWrap.good::before{box-shadow:inset 0 0 0 2px var(--ok);animation:alarm .9s ease-out}
@keyframes alarm{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.toast{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 12px;border-radius:6px;background:rgba(16,21,28,.96);border:1px solid var(--rule2);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.35);animation:tin .2s ease-out}
.toast.good{color:var(--text);border-left:3px solid var(--ok)}.toast.bad{color:var(--text);border-left:3px solid var(--bad)}
.toast.gold{color:var(--text);border-left:3px solid var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#paused{font-family:var(--sans);font-size:13px;color:var(--text);background:rgba(16,21,28,.96);border:1px solid var(--rule2);border-left:3px solid var(--warn);border-radius:6px;padding:6px 12px}
#bottom{background:var(--console);border-top:1px solid var(--rule);box-shadow:none}
#coach,#logWrap{border-right-color:var(--rule)}
.ch .k,.ph{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.ch .k{color:var(--dim)}
.lvl{color:var(--dim);border-color:var(--rule2)}
.phrase{background:var(--well);border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:6px;font-size:13.5px;box-shadow:none}
.phrase .blank{color:var(--warn)}
.ctitle .cs{color:var(--tx)}
.cbtn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--rule2);background:var(--card2);color:var(--text2);font-size:12.5px;font-weight:600}
.cbtn:hover{background:#202834;color:var(--text)}
#freqDisp{background:var(--well);border:1px solid var(--rule);border-radius:6px;box-shadow:none}
#freqDisp b{color:#F0B44C;text-shadow:none}
#freqDisp span{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--dim)}
#wave{display:flex;gap:2px;align-items:center;height:18px;margin:0 auto 0 10px}
#wave i{width:3px;height:3px;border-radius:2px;background:#2A3340}
body[data-rx] #wave i{background:var(--ok);animation:wv .42s ease-in-out infinite alternate}
body[data-tx] #wave i{background:var(--bad);animation:wv .3s ease-in-out infinite alternate}
#wave i:nth-child(2){animation-delay:-.1s}#wave i:nth-child(3){animation-delay:-.25s}#wave i:nth-child(4){animation-delay:-.05s}#wave i:nth-child(5){animation-delay:-.3s}#wave i:nth-child(6){animation-delay:-.15s}#wave i:nth-child(7){animation-delay:-.22s}
@keyframes wv{to{height:18px}}
#pttBtn{background:var(--card2);border:1px solid var(--rule2);border-radius:10px;box-shadow:none;color:var(--text);text-shadow:none;font-family:var(--sans);font-size:14px;letter-spacing:.04em}
#pttBtn:hover{background:#1E2631}
#pttBtn::after{background:#3A2A2A;box-shadow:none}
#pttBtn.on{background:#C8352D;border-color:#C8352D;color:#fff;transform:none;box-shadow:none;animation:none}
#pttBtn.on::after{background:#fff;box-shadow:none}
#txInput{background:var(--well);border-color:var(--rule2);border-radius:6px}
#txInput:focus{border-color:var(--acc);outline:none}
#strips{background:var(--console);border-left:1px solid var(--rule);box-shadow:none}
.gh{background:var(--console);border-bottom:1px solid var(--rule)}
.gh b{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text2)}
.gh .who{border-radius:4px}
.gh .who.you{background:rgba(63,191,127,.16);color:#7FD8A8;box-shadow:none}.gh .who.ai{background:var(--card2);color:var(--dim)}
.gl{background:none;gap:6px}
.strip{background:var(--card);color:var(--text);border:1px solid var(--rule);border-left:3px solid var(--dep);border-radius:6px;box-shadow:none;padding:7px 10px 7px 11px}
.strip:hover{background:var(--card2)}
.strip.arr{background:var(--card);border-left-color:var(--arr);box-shadow:none}
.strip .cs{color:var(--text)}.strip .cs i{color:var(--dim)}.strip .st,.strip .rt{color:var(--text2)}
.strip.ai{background:transparent;opacity:.5;box-shadow:none}
.strip.req{background:#1F1B12;border-color:#4A3C1C;border-left-color:var(--warn);animation:none}
.strip .rq{color:var(--warn)}.strip .rq.late{color:var(--bad)}
.strip.sel{outline:none;border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:#152235}
.strip.emg{border-left-color:var(--bad);background:#221416;border-color:#4A2226}
.tag.v{color:#B9A3F5}.tag.e{color:#fff;background:var(--bad);border-color:var(--bad)}
.callname{background:var(--well);border:1px solid var(--rule);border-radius:6px}
.callname b{font-family:var(--sans);font-size:18px;color:var(--text)}
.callname .say{color:var(--tx)}
/* ---- menus and dialogs ---- */
#overlay{background:rgba(5,8,12,.72);backdrop-filter:blur(2px)}
.modal{background:var(--console);border:1px solid var(--rule2);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.55);padding:0 32px 28px;gap:24px}
.hero{background:none;border-bottom:1px solid var(--rule);grid-template-columns:minmax(0,1fr) 150px;padding:30px 32px 24px;margin:0 -32px}
.wm{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--tx);text-shadow:none;margin-bottom:10px}
.hero h1,.modal h1{font-family:var(--sans);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em;color:var(--text);background:none;-webkit-background-clip:border-box;background-clip:border-box;filter:none;margin:0 0 12px}
.modal h2{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--dim)}
.modal p{color:var(--text2)}
.dial{width:150px;height:150px;border:1px solid var(--rule2);background:radial-gradient(circle,#101922 0,#0B1118 70%);box-shadow:none}
.dial::before{background:repeating-radial-gradient(circle,transparent 0 18px,rgba(90,162,255,.13) 18px 19px)}
.dial::after{background:conic-gradient(from 0deg,transparent 0 80%,rgba(90,162,255,.22) 100%)}
.dial i{background:#9CC6FF;box-shadow:none}
.rank{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;max-width:440px}
.rank b{font-family:var(--sans);font-size:15px;letter-spacing:.02em;color:var(--text);text-shadow:none}
.rank span{font-size:13px;color:var(--dim)}
.rank .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden;box-shadow:none}
.rank .bar i{display:block;height:100%;background:var(--acc);box-shadow:none}
.go{height:46px;padding:0 26px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.01em;box-shadow:none}
.go:hover{background:var(--acc2)}
.foot{border-top-color:var(--rule)}
.foot .cbtn{height:46px;padding:0 18px;font-size:14px}
kbd{background:var(--card2);border-color:var(--rule2);color:var(--text)}
/* big choice cards: one quiet style, a coloured edge says what they are */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button,.mainbtns button,.mcard{background:var(--card);border:1px solid var(--rule);box-shadow:none;transition:background .12s,border-color .12s}
.quick button:hover,.mainbtns button:hover,.mcard:not(.locked):hover{background:var(--card2);border-color:var(--rule2);transform:none;box-shadow:none}
.quick button{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:8px}
.quick b{font-family:var(--sans);font-size:16px;font-weight:700;color:var(--text)}
.quick span{font-size:13px;color:var(--dim);line-height:17px}
.quick button[data-q=all],.quick button[data-q=live]{background:var(--card);border-color:var(--rule)}
.mainbtns{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
.mainbtns button{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:10px}
.mainbtns button[data-go=career]{background:var(--card);border-color:var(--rule);border-top:2px solid var(--acc);box-shadow:none}
.mainbtns b{font-family:var(--sans);font-size:22px;font-weight:700;line-height:1.1;letter-spacing:0;color:var(--text)}
.mainbtns span{font-size:13.5px;color:var(--dim);line-height:19px}
.mainbtns em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:auto;padding-top:6px}
.achs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--well);opacity:.55}
.ach.got{opacity:1;border-color:#4A3C1C;background:#1A170F;box-shadow:none}
.ach b{display:block;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--text)}.ach.got b{color:#F0C46A}
.ach span{font-size:12.5px;color:var(--dim)}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:10px}
.mcard.locked{opacity:.4;cursor:not-allowed;background:var(--well)}
.mn{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--dim);text-shadow:none;width:28px;text-align:center}
.mb b{display:block;font-family:var(--sans);font-size:16px;font-weight:700;color:var(--text)}.mb span{font-size:13px;color:var(--dim)}
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.mr em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.stars i{font-style:normal;font-size:16px;color:#2C3542}.stars i.on{color:var(--warn);text-shadow:none}
.bigstars{display:flex;flex-direction:column;align-items:center;gap:6px;justify-self:end}
.bigstars .stars i{font-size:40px}.bigstars em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--text2)}
.bigstars.fail em{color:var(--dim)}
.grade{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-weight:700;font-size:64px;line-height:1;color:var(--ok);border:2px solid currentColor;box-shadow:none;text-shadow:none;justify-self:end}
.grade.gB{color:var(--tx)}.grade.gC{color:var(--warn)}.grade.gD{color:var(--bad)}
.stats{gap:10px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:8px}
.stat span{color:var(--dim)}.stat b{color:var(--text);text-shadow:none;font-size:22px}
.opt{background:var(--card);border:1px solid var(--rule);border-radius:8px}
.opt:hover{border-color:var(--rule2)}
.opt:has(input:checked){border-color:var(--acc);background:#132033}
.opt b{font-family:var(--sans);font-size:15px;font-weight:700}
.opt .f{color:var(--dim)}
.opt:has(input:checked) .chk{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 3px #132033}
.seg{background:var(--well);border:1px solid var(--rule);box-shadow:none}
.seg label:has(input:checked){background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rule2)}
.toggles label{border-bottom-color:var(--rule)}
.toggles input,.chkrow input{accent-color:var(--acc)}
.vrow input:not([type=checkbox]){background:var(--well);border-color:var(--rule2);color:var(--text)}
.note{color:#E9D3A6;background:#1C180F;border-color:#4A3C1C}
.apts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.apt{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--rule);cursor:pointer;position:relative}
.apt:hover{border-color:var(--rule2)}
.apt input{position:absolute;opacity:0;pointer-events:none}
.apt.on,.apt:has(input:checked){border-color:var(--acc);background:#132033;box-shadow:inset 0 0 0 1px var(--acc)}
.apt:has(input:focus-visible){outline:2px solid var(--tx);outline-offset:2px}
.aptsvg{width:100%;height:auto;border-radius:5px;display:block}
.aptn{display:flex;flex-direction:column}.aptn b{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--text);line-height:1.2}.aptn em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.aptf{font-size:12px;color:var(--text2)}.aptd{font-size:12.5px;color:var(--dim);line-height:16px}
.aptm{font-size:11.5px;color:var(--tx);margin-top:auto;padding-top:2px}
.rwyo{grid-template-columns:repeat(2,minmax(0,1fr))}
.crewst{background:var(--well);border:1px solid var(--rule);border-radius:8px}
.crewst i.on{background:var(--ok);box-shadow:none}.crewst i.part{background:var(--warn)}
.crewst b{color:var(--text)}
/* ---- mission HUD ---- */
#hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;min-width:250px;max-width:46%;background:rgba(16,21,28,.95);border:1px solid var(--rule2);border-radius:8px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.hm{display:flex;align-items:baseline;gap:10px}
.hm b{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc{display:none;font-family:var(--mono);font-size:12px;color:var(--ok)}
.ht{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);text-shadow:none}
.ht.low{color:var(--bad);text-shadow:none}
.hgs{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.hg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
.hg i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--rule2);flex:none}
.hg.ok{color:var(--text)}.hg.ok i{background:var(--ok);border-color:var(--ok);box-shadow:none}
.hg em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-left:auto}
.hgs.big{gap:8px;margin-top:10px}.hgs.big .hg{font-size:14.5px}.hgs.big .hg i{width:15px;height:15px}
.modal.narrow{width:min(480px,100%)}
.pbtns{display:flex;flex-direction:column;gap:8px}.pbtns .cbtn{height:44px;font-size:14px}
body.quiet .score{display:none}
@media (max-width:1100px){.quick,.apts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
  .hero{grid-template-columns:minmax(0,1fr) 72px;margin:0 -16px;padding:20px 16px 18px}.hero h1,.modal h1{font-size:28px}.dial,.grade{width:72px;height:72px}.grade{font-size:38px}
  .wm{font-size:11px}.quick b{font-size:15px}.quick button{padding:11px}
  #wave{margin-left:8px}
  #hud{top:auto;bottom:8px;left:auto;right:8px;transform:none;min-width:0;max-width:52%;padding:5px 10px}.hgs:not(.big){display:none}.hc{display:inline}.hm b{font-size:13px}.ht{font-size:13px}
  .mainbtns,.mlist{grid-template-columns:1fr}.mainbtns button{padding:16px}.mainbtns b{font-size:19px}
  .achs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bigstars .stars i{font-size:24px}.bigstars em{font-size:12px}
  .mcard{padding:12px;gap:10px}.mn{font-size:16px;width:20px}.mb b{font-size:15px}
  .foot{gap:10px}
  .apts,.rwyo{grid-template-columns:1fr}
  #osmCredit{bottom:auto;top:44px;left:8px;font-size:10px}
  #mtabs{background:var(--console);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  #mtabs button{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em}
  #mtabs button.on{background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule2)}
  #ptt{background:var(--console);border-top:1px solid var(--rule);box-shadow:none}
  .viewbar .vsep{margin:5px 2px}
}
.strip .cs em.tel{font-style:normal;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--dim);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.dial::after,.toast,#wave i,.score b.bump,#scopeWrap.alarm::before,#scopeWrap.good::before{animation:none}}
/* ---------- flight strips: printed paper strips in holders, in a strip bay ---------- */
#strips{container-type:inline-size;background:#121417}
#strips .gh{background:#1A1D21;border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 #2A2E34}
#strips .gl{gap:3px;padding:7px 6px 12px 6px;background:linear-gradient(90deg,#0B0C0E,#16191C 5px,#111316)}
#strips .strip{position:relative;display:block;padding:3px 3px 3px 7px;margin:0;border:0;border-radius:3px;text-align:left;width:100%;color:#15160F;
  background:linear-gradient(#2C3036,#181A1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 1px 0 #000;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;font-family:var(--mono)}
#strips .strip::before{content:'';position:absolute;left:2px;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--dep)}
#strips .strip.arr::before{background:var(--arr)}
#strips .strip:hover{background:linear-gradient(#353A41,#1C1F23)}

        if (ac.blockT > 20 && (headOnYield(ac) === b || (headOnYield(b) !== ac && ac.id > b.id)) && towBack(ac, b)) { ac.blockedBy = null; return; }
        if (!ac.flags.noseTip && S.staffed.GND && ['GND', 'TWR'].includes(ac.freq) && ac.blockT > 30) {
          ac.flags.noseTip = true;
          UI.log('SYS', ac.cs + ' and ' + b.cs + ' are nose to nose on the taxiway. Hold one and give the other a different route (“taxi via …”).', 'tip');
        }
      }
    }
    return;
  }
  ac.blockT = 0; ac.blockedBy = null;
  const xc = !backwards && ac.xs && ac.xs[0];
  if (xc) {
    if (ac.node === xc.rwyNode || (ac.hist || []).includes(xc.rwyNode)) ac.xs.shift(); // across that one
    else if (ac.node === xc.node && !xc.clr) { // holding short of the runway it has to cross
      ac.spd = 0;
      if (!xc.asked) { xc.asked = true; xc.at = S.t; setRequest(ac, 'cross', true); }
      return;
    }
  }
  const n = NODES[ac.path[0]];
  const d = dist(ac.x, ac.y, n.x, n.y);
  // speed like a heavy aircraft: it gets going slowly, brakes harder, slows for turns and for the stop at the end
  let vmax = kts; const smooth = !window.OLDMOVE;
  if (smooth && !backwards && !ac.towBack) {
    const tn = turnAhead(ac, 0.035);
    if (tn > 60) vmax = Math.min(vmax, 9); else if (tn > 28) vmax = Math.min(vmax, 12);
    const rem = pathLeft(ac, 0.05); if (rem < 0.035) vmax = Math.min(vmax, Math.max(3, rem * 1852 / 5));
    if (ac.followMe) vmax = Math.min(vmax, 12); // behind the follow-me car
  }
  if (!isFinite(ac.spd)) ac.spd = 0;
  if (!smooth) ac.spd = kts; else ac.spd = ac.spd < vmax ? Math.min(vmax, ac.spd + (backwards ? 1 : 1.6) * dt) : Math.max(vmax, ac.spd - 3.5 * dt);
  const step = Math.max(ac.spd, 0.6) / 3600 * dt;
  const turnTo = (h, rate) => { const dh = hdgDiff(ac.hdg, h); ac.hdg = norm360(ac.hdg + clamp(dh, -rate * dt, rate * dt)); };
  // a pushback swings the tail round so the aircraft ends up facing along the taxiway
  if (smooth && ac.phase === 'pushing' && !ac.towBack) {
    if (!ac.push) { const pp = S.depEntry && findPath(n.id, S.depEntry.hs, null), q = pp && pp.length ? NODES[pp[0]] : null; ac.push = { x: ac.x, y: ac.y, h0: ac.hdg, h1: q && dist(n.x, n.y, q.x, q.y) > 1e-5 ? brg(n.x, n.y, q.x, q.y) : ac.hdg, L: Math.max(d, 1e-5) }; }
    const P = ac.push, prog = clamp(1 - d / P.L, 0, 1), s = clamp((prog - 0.3) / 0.7, 0, 1), e = s * s * (3 - 2 * s);
    ac.hdg = norm360(P.h0 + hdgDiff(P.h0, P.h1) * e);
  }
  if (d > 1e-6 && !backwards) ac.hdg = brg(ac.x, ac.y, n.x, n.y); // the sim goes junction to junction; the picture rounds the corners (cornerPose)
  if (step >= d) {
    ac.push = null;
    ac.x = n.x; ac.y = n.y; ac.node = n.id; ac.path.shift();
    if (!ac.towBack) { (ac.hist = ac.hist || []).push(n.id); if (ac.hist.length > 20) ac.hist.shift(); }
    if (!ac.path.length) { ac.spd = 0; ac.towBack ? towBackDone(ac) : arrivedAtNode(ac); }
  } else {
    ac.x += (n.x - ac.x) / d * step; ac.y += (n.y - ac.y) / d * step;
  }
}

function arrivedAtNode(ac) {
  const ph = ac.phase;
  if (ph === 'pushing') {
    ac.phase = 'taxi_wait'; ac.pushEndT = S.t;
    const pp = S.depEntry && findPath(ac.node, S.depEntry.hs, null); // the tug leaves the nose pointing the way it will taxi
    if (pp && pp.length) { const q = NODES[pp[0]]; if (dist(ac.x, ac.y, q.x, q.y) > 1e-5) ac.hdg = brg(ac.x, ac.y, q.x, q.y); }
    const g = GATES.find(g => g.n === ac.gate); if (g && g.occ === ac.id) g.occ = null;
    ac.flags.lastGate = ac.gate; ac.gate = null;
    schedule(rnd(6, 14), () => { if (S.aircraft.includes(ac) && ac.phase === 'taxi_wait') setRequest(ac, 'taxi', true); });
  } else if (ph === 'taxiing') {
    ac.phase = 'holdshort';
    if (ac.freq === 'TWR') setRequest(ac, 'takeoff', true);
    else setRequest(ac, 'handoff_twr', true);
    if (ac.toClr) beginLineup(ac, true);
    else if (ac.luawPending) { ac.luawPending = false; beginLineup(ac, false); }
  } else if (ph === 'lineup_move') {
    ac.phase = 'lineup'; ac.hdg = course();
    if (ac.toClr) startRoll(ac);
  } else if (ph === 'exiting') {
    ac.phase = 'vacated';
    schedule(rnd(2, 4), () => {
      if (!S.aircraft.includes(ac) || ac.phase !== 'vacated') return;
      if (ac.freq === 'TWR') setRequest(ac, 'handoff_gnd', true);
      else if (ac.freq === 'GND') setRequest(ac, 'taxi_in', true);
    });
  } else if (ph === 'taxiing_in') {
    ac.phase = 'parked'; ac.request = null;
    const g = GATES.find(g => g.n === ac.gate);
    if (g) ac.hdg = g.hdg;
    ac.parkedAt = S.t;
    pilotSay(ac, `${ac.cs}, at the gate. Thanks for the help.`, true);
    S.stats.arrs++; award(100, `${ac.cs} parked`);
    if (ac.emg) { S.stats.emg++; award(250, 'emergency landed safely'); }
    schedule(150, () => removeAc(ac)); // the turnaround starts; the stand frees up later
  }
}

function beginLineup(ac, alsoTakeoff) {
  const e = S.depEntry, i = e.path.indexOf(e.hs);
  ac.path = e.path.slice(0, i).reverse().concat(S.depBack || []); ac.phase = 'lineup_move'; ac.toClr = !!alsoTakeoff;
}
function startRoll(ac) { Radio.roar(); S.lastDep = { t: S.t, heavy: ac.perf.heavy, cs: ac.cs }; ac.phase = 'takeoff'; ac.spd = Math.max(ac.spd, 0); ac.hdg = course(); ac.request = null; }

function stepTakeoff(ac, dt) {
  const r = ac.hdg * Math.PI / 180;
  if (ac.alt <= 0) {
    ac.spd += 3.5 * dt * (window.Env ? Env.accel() : 1);
    if (ac.spd >= ac.perf.vr) { ac.alt = 1; ac.vs = 2500 / 60; }
  } else {
    ac.phase = 'climb'; ac.tgtAlt = ac.clearedAlt; ac.tgtSpd = 220; ac.tgtHdg = course(); S.stats.takeoffs++;
    S.depReleaseT = S.t;
    schedule(rnd(4, 8), () => { if (S.aircraft.includes(ac) && ac.freq === 'TWR' && !ac.request) setRequest(ac, 'handoff_dep', false); });
  }
  const gs = Math.max(0, ac.spd + (window.Env && ac.alt < 50 ? Env.along(ac.hdg, 0) : 0));
  ac.x += Math.sin(r) * gs / 3600 * dt; ac.y += Math.cos(r) * gs / 3600 * dt;
}

function stepRollout(ac, dt) {
  const R = ARRR(), fwd = S.flow === 'W' ? -1 : 1, r = ac.hdg * Math.PI / 180;
  ac.spd = Math.max(30, ac.spd - 5 * dt * (window.Env ? Env.braking() : 1));
  const ahead = S.aircraft.find(o => o !== ac && onGround(o) && Math.abs(o.y - R.y) < 0.02 && (o.x - ac.x) * fwd > 0 && Math.abs(o.x - ac.x) < 0.25);
  if (ahead) ac.spd = Math.abs(ahead.x - ac.x) < GSEP + 0.01 ? 0 : Math.min(ac.spd, Math.max(12, ahead.spd));
  const step = Math.max(3, ac.spd + (window.Env ? Env.along(ac.hdg, 0) * clamp((ac.spd - 30) / 40, 0, 1) : 0)) / 3600 * dt; // the wind matters while it is fast; at taxi speed it rolls on its own
  // exits that lead to the stands, are not the departures' way in, and have nobody waiting in them
  const busy = e => S.aircraft.some(o => o !== ac && onGround(o) && [e.hs, e.tw].some(id => dist(o.x, o.y, NODES[id].x, NODES[id].y) < 0.03));
  let ok = R.entries.filter(e => e.okArr !== false && !(mixedOps() && S.depEntry && e.hs === S.depEntry.hs) && !busy(e));
  if (!ok.length) ok = R.entries.filter(e => e.okArr !== false);
  if (!ac.exit && ac.spd <= 70) {
    const fwdOf = e => (e.x - ac.x) * fwd;
    const good = ok.filter(e => fwdOf(e) > 0.05 && e.dx * fwd > -0.003).sort((a, b) => fwdOf(a) - fwdOf(b));
    const any = ok.filter(e => fwdOf(e) > 0.02).sort((a, b) => fwdOf(a) - fwdOf(b));
    ac.exit = good[0] || any[0] || null;
    if (!ac.exit && ok.length) return backtrack(ac, R, ok.slice().sort((a, b) => (b.x - a.x) * fwd)[0]);
  }
  if (ac.exit) {
    const n = NODES[ac.exit.rn];
    if ((n.x - ac.x) * fwd <= Math.max(step, 0.001)) {
      ac.x = n.x; ac.y = n.y; ac.node = n.id; ac.exitName = ac.exit.name;
      ac.path = ac.exit.path.slice(1); ac.phase = 'exiting'; ac.exit = null;
      return;
    }
  }
  const end = fwd > 0 ? R.x2 : R.x1;
  if ((ac.x - end) * fwd > 0 && ok.length) return backtrack(ac, R, ok.slice().sort((a, b) => (b.x - a.x) * fwd)[0]);
  ac.x += Math.sin(r) * step; ac.y = R.y;
}
// turn round on the runway and taxi back along it to an exit
function backtrack(ac, R, e) {
  const fwd = S.flow === 'W' ? -1 : 1, ex = NODES[e.rn].x;
  const along = Object.values(NODES).filter(n => n.kind === 'rwy' && n.rwy === R.id && (n.x - ac.x) * fwd < 0 && (n.x - ex) * fwd > 0)
    .sort((a, b) => Math.abs(a.x - ac.x) - Math.abs(b.x - ac.x));
  ac.path = along.map(n => n.id).concat(e.path); ac.phase = 'exiting'; ac.exitName = e.name; ac.exit = null; ac.spd = 0;
}

function stepAir(ac, dt) {
  // --- navigation ---
  if (ac.phase === 'climb' || ac.phase === 'dep') {
    if (!ac.vectored && !ac.direct && ac.alt > 1500 && !(window.Proc && Proc.holdsTrack(ac))) { const f = FIXES[ac.exitFix]; ac.tgtHdg = brg(ac.x, ac.y, f.x, f.y); ac.turnDir = null; }
    if (ac.alt > 3000 && ac.tgtSpd < 250) ac.tgtSpd = 250;
  }
  if (ac.direct) { const f = FIXES[ac.direct]; if (f) { ac.tgtHdg = brg(ac.x, ac.y, f.x, f.y); ac.turnDir = null; if (dist(ac.x, ac.y, f.x, f.y) < 1) ac.direct = null; } }
  if (ac.phase === 'arr') {
    if (!ac.vectored && !ac.direct && !ac.loc) {
      // the arrival route: over its entry fix first, then to the start of the approach
      const vf = ac.viaFix && FIXES[ac.viaFix];
      if (vf && dist(ac.x, ac.y, vf.x, vf.y) < 1.5) ac.viaFix = null;
      const q = ac.viaFix ? vf : starPoint(ac);
      if (!ac.viaFix && dist(ac.x, ac.y, q.x, q.y) < 1.5 || ac.holding) { ac.holding = true; ac.tgtHdg = norm360(ac.hdg + 60); ac.turnDir = 'R'; }
      else { ac.tgtHdg = brg(ac.x, ac.y, q.x, q.y); ac.turnDir = null; }
      if (!ac.altAssigned) ac.tgtAlt = locGeom(ac.x, ac.y).d < 6 ? Math.max(ac.alt, 11000) : Math.max(Math.min(ac.tgtAlt, ac.starAlt), window.Proc ? Math.min(ac.alt, Proc.mvaAlong(ac.x, ac.y, q.x, q.y)) : 0); // the STAR's altitudes keep it above the terrain
    }
    approachLogic(ac, dt);
    if (ac.phase !== 'arr') return;
  }
  if (ac.phase === 'ga') {
    if (ac.alt > 2500 && !ac.flags.gaCalled) { ac.flags.gaCalled = true; }
  }
  // --- heading ---
  const rate = (ac.perf.heavy ? 2.5 : 3) * dt;
  let dh = hdgDiff(ac.hdg, ac.tgtHdg);
  if (ac.turnDir === 'L' && dh > 0 && Math.abs(dh) > 2) dh = dh - 360;
  if (ac.turnDir === 'R' && dh < 0 && Math.abs(dh) > 2) dh = dh + 360;
  if (Math.abs(dh) <= rate) { ac.hdg = norm360(ac.tgtHdg); if (!ac.holding) ac.turnDir = null; }
  else ac.hdg = norm360(ac.hdg + Math.sign(dh) * rate);
  // --- altitude ---
  if (!ac.gs) {
    const climb = (ac.alt < 10000 ? 2600 : 2000) / 60, desc = 1900 / 60;
    const da = ac.tgtAlt - ac.alt;
    ac.vs = da > 0 ? Math.min(da / dt, climb) : Math.max(da / dt, -desc);
    ac.alt += ac.vs * dt;
  }
  // --- speed ---
  let ts = ac.tgtSpd;
  if (ac.alt < 10000) ts = Math.min(ts, 250);
  ts = Math.max(ts, ac.perf.vapp);
  const ds = ts - ac.spd;
  ac.spd += clamp(ds, -1.2 * dt, 2 * dt);
  // --- move ---
  const r = ac.hdg * Math.PI / 180;
  ac.x += Math.sin(r) * ac.spd / 3600 * dt; ac.y += Math.cos(r) * ac.spd / 3600 * dt;
  if (window.Env) { const w = Env.windAt(ac.alt); ac.x += w.x / 3600 * dt; ac.y += w.y / 3600 * dt; } // the wind carries it

  // --- departure progression ---
  if ((ac.phase === 'climb' || ac.phase === 'dep') && ac.kind === 'dep') {
    const d = dist(0, 0, ac.x, ac.y);
    if (ac.freq === 'TWR' && ac.alt > 3500 && !ac.flags.depLate) {
      ac.flags.depLate = true; S.stats.missedHandoffs++; award(-25, `${ac.cs}: late handoff to Departure`);
      pilotCall(ac, 'handoff_dep', true);
    }
    if (ac.freq === 'APP' && !ac.request && !ac.flags.ctrReq && (ac.alt >= 9500 || d > 22)) { ac.flags.ctrReq = true; setRequest(ac, 'handoff_ctr', false); }
    if (ac.freq === 'APP' && d > 34 && !ac.flags.ctrLate) { ac.flags.ctrLate = true; pilotCall(ac, 'handoff_ctr', true); }
    if (d > 40) {
      if (ac.freq !== 'CTR') { S.stats.missedHandoffs++; award(-50, `${ac.cs} left your airspace without a handoff`); }
      S.stats.deps++; removeAc(ac);
    }
  }
  if (ac.phase === 'ga' && ac.freq === 'APP') ac.phase = 'arr';
}

function approachLogic(ac, dt) {
  const g = locGeom(ac.x, ac.y), c = course();
  if (ac.ils && !ac.loc) {
    const closing = Math.abs(hdgDiff(ac.hdg, c)) < 80;
    if (g.d > 1.5 && g.d < 38 && Math.abs(g.cross) < 0.9 && closing) {
      ac.loc = true; ac.vectored = false; ac.direct = null; ac.holding = false; ac.turnDir = null; S.stats.ils++;
    }
  }
  if (ac.loc) {
    ac.tgtHdg = norm360(c - clamp(g.cross * 70, -35, 35) + (window.Env ? Env.wca(c, ac.spd, ac.alt) : 0)); // into the wind
    if (Math.abs(g.cross) < 0.06) { // settle on centerline
      const T = thr(), cr = c * Math.PI / 180;
      const ux = Math.sin(cr), uy = Math.cos(cr);
      ac.x -= uy * g.cross * 0.2 * dt; ac.y += ux * g.cross * 0.2 * dt;
    }
    const gsAlt = Math.max(0, g.d * 318);
    if (!ac.gs && ac.alt >= gsAlt - 150) ac.gs = true;
    if (ac.gs) {
      const vsMax = 40 * dt;
      ac.alt += clamp(gsAlt - ac.alt, -vsMax, vsMax);
    }
    if (g.d < 10) ac.tgtSpd = Math.min(ac.tgtSpd, 180);
    if (g.d < 5) ac.tgtSpd = ac.perf.vapp + (window.Env ? Env.gustAdd() : 0);
    if (g.d < 1.6 && ac.landClr && !ac.flags.windChk && window.Env) { // beyond the aircraft's wind limits, some crews go around
      ac.flags.windChk = true; const tw = Env.tailwind(), xw = Env.crosswind();
      if ((tw > 12 || xw > 32) && Math.random() < 0.35) { const sc0 = S.score; goAround(ac, tw > 12 ? `tailwind ${tw} knots` : `crosswind ${xw} knots`); S.score = sc0; return; }
    }
    // handoff to tower
    if (ac.freq === 'APP' && g.d < 14 && (!ac.request || ac.request.type !== 'handoff_twr_arr')) setRequest(ac, 'handoff_twr_arr', false);
    if (ac.freq === 'APP' && g.d < 5 && !ac.flags.twrLate) { ac.flags.twrLate = true; S.stats.missedHandoffs++; award(-25, `${ac.cs}: late handoff to Tower`); pilotCall(ac, 'handoff_twr_arr', true); }
    // stability / landing
    if (g.d < 3.5 && ac.alt > gsAlt + 700) return goAround(ac, 'unstable approach — too high');
    if (g.d < 0.6 && !ac.landClr) return goAround(ac, 'no landing clearance');
    if (g.d < 0.8 && ac.landClr && window.Sit && Sit.closed(S.rwyArr)) return goAround(ac, 'runway closed');
    if (g.d < 0.8 && ac.landClr && runwayOccupied(S.rwyArr, ac)) { const AR = ARRR(), o = S.aircraft.find(o => o !== ac && onGround(o) && Math.abs(o.y - AR.y) < 0.02 && o.x >= AR.x1 - 0.05 && o.x <= AR.x2 + 0.05); return goAround(ac, `runway not clear (${o ? o.cs + ' still on it' : 'traffic'})`); }
    if (g.d <= 0.12 && ac.landClr) {
      Radio.thump(); R.puff(ac.x, ac.y); S.stats.landings++; if (ac.emg) S.stats.emgLanded++; if (window.Sit) Sit.landed(ac);
      ac.tdT = S.t; ac.phase = 'rollout'; ac.alt = 0; ac.gs = false; ac.loc = false; ac.hdg = c; ac.y = ARRR().y; ac.request = null; ac.vs = 0;
      ac.spd = ac.perf.vapp - 5;
    }
  }
}

function runwayOccupied(rid, except) {
  const off = new Set(['vacated', 'holdshort', 'gate', 'parked', 'pushing', 'taxi_wait']); // these are clear of the runway by definition, however close a short exit leaves them
  return S.aircraft.some(o => o !== except && onGround(o) && !off.has(o.phase) && Math.abs(o.y - RWY[rid].y) < 0.02 && o.x >= RWY[rid].x1 - 0.05 && o.x <= RWY[rid].x2 + 0.05);
}

function goAround(ac, why) {
  ac.phase = 'ga'; ac.ils = ac.loc = ac.gs = ac.landClr = false; ac.vectored = true; ac.direct = null;
  ac.tgtAlt = 2000; ac.tgtHdg = norm360(course() + (S.flow === 'W' ? -30 : 30)); ac.tgtSpd = 200; ac.turnDir = null; ac.flags.wentAround = true;
  ac.flags.twrLate = false;
  if (window.Proc) Proc.missed(ac); // the published missed approach, until a controller says otherwise
  S.stats.ga++; award(-150, `${ac.cs} went around (${why})`);
  UI.log('SYS', `${ac.cs} went around: ${why}.`, 'alert');
  pilotSay(ac, `${ac.cs}, going around${why.startsWith('no landing') ? ', no landing clearance' : ''}.`);
  if (ac.freq === 'TWR') setRequest(ac, 'handoff_ga', false);
  else { ac.request = null; setRequest(ac, 'arr_checkin', false); }
}

function removeAc(ac) {
  const i = S.aircraft.indexOf(ac); if (i >= 0) S.aircraft.splice(i, 1);
  GATES.forEach(g => { if (g.occ === ac.id) g.occ = null; });
  if (S.sel === ac) S.sel = null;
}

/* ---------- Separation ---------- */
function checkSeparation() {
  const air = S.aircraft.filter(a => !onGround(a) && a.alt > 200);
  for (const a of air) { a.ca = false; a.los = false; }
  for (let i = 0; i < air.length; i++) for (let j = i + 1; j < air.length; j++) {
    const a = air[i], b = air[j];
    const da = Math.abs(a.alt - b.alt);
    if (a.alt < 3200 && b.alt < 3200 && dist(0, 0, a.x, a.y) < 7 && dist(0, 0, b.x, b.y) < 7) continue; // tower visual separation
    if (da >= 950) continue;
    const d = dist(a.x, a.y, b.x, b.y);
    // 45 s projection
    const pa = project(a, 45), pb = project(b, 45);
    const dp = dist(pa.x, pa.y, pb.x, pb.y);
    const minSep = a.loc && b.loc ? 2.5 : 3;
    if (d < minSep) {
      a.los = b.los = true;
      const key = [a.id, b.id].join('-');
      if (!S.losPairs[key] || S.t - S.losPairs[key] > 120) {
        S.losPairs[key] = S.t; S.stats.los++; award(-300, `Loss of separation ${a.cs} / ${b.cs}`);
        UI.log('SYS', `⚠ LOSS OF SEPARATION — ${a.cs} and ${b.cs}: ${d.toFixed(1)} NM, ${Math.round(da)} ft`, 'alert');
      }
    } else if (dp < 3.5 || d < 4.5) { a.ca = b.ca = true; }
  }
  const any = air.some(a => a.ca || a.los);
  if (any && !S.caPrev) Radio.alert('ca');
  S.caPrev = any;
}
function project(a, s) { const r = a.hdg * Math.PI / 180; return { x: a.x + Math.sin(r) * a.spd / 3600 * s, y: a.y + Math.cos(r) * a.spd / 3600 * s }; }

/* ---------- Main tick ---------- */
const SPAWN_INT = { light: [300, 330], medium: [180, 200], heavy: [110, 120] };
function simStep(dt) {
  S.t += dt;
  // events
  S.events.sort((a, b) => a.at - b.at);
  while (S.events.length && S.events[0].at <= S.t) { const e = S.events.shift(); try { e.fn(); } catch (err) { console.error(err); } }
  for (const ac of S.aircraft.slice()) stepAircraft(ac, dt);
  if (window.Sit) Sit.step(dt);
  if (window.RTools) RTools.step(dt);
  if (window.Replay) Replay.step();
  if (window.Gops) Gops.tick();
  if (window.Env) Env.step();
  // spawning
  const cap = { light: 8, medium: 12, heavy: 16 }[S.density];
  const aiCap = Live.on ? (Live.fill ? Math.min(cap, 5) : 0) : cap;
  if (S.t >= S.spawnDep) { S.spawnDep = S.t + rnd(...SPAWN_INT[S.density]); if (S.aircraft.length < aiCap) spawnDeparture(); }
  if (S.t >= S.spawnArr) { S.spawnArr = S.t + rnd(...SPAWN_INT[S.density]); if (S.aircraft.length < aiCap) spawnArrival(false); }
  Live.step();
  // request timers
  for (const ac of S.aircraft) {

const AI = {

      if (window.Sit && Sit.skipAI(ac) && !(ac.request && ac.request.called)) continue;
      const r = ac.request && ac.request.called ? ac.request : null;

function mapThumbs() {
  const cvs = [...document.querySelectorAll(".aptmap")]; let n = 0;
  const paint = () => {
    for (const cv of cvs) {
      const a = AIRPORTS[cv.dataset.apt], dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 240, h = Math.round(w * 0.43);
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const b = a.data.bounds, sc = Math.min(w / (b[2] - b[0] + 0.1), h / (b[3] - b[1] + 0.1)), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
      OSM.draw(c, { x: 0, y: 0, w, h }, x => w / 2 + (x - cx) * sc, y => h / 2 - (y - cy) * sc, sc, "day", a, true);
    }
    if (++n < 16 && document.contains(cvs[0])) setTimeout(paint, 350);
  };
  if (cvs.length) paint();
}

/* ---------- Main loop ---------- */
let lastFrame = performance.now(), uiTimer = 0;

    S.acc = (S.acc || 0) + dtReal * S.speed;
    let n = 0;
    while (S.acc >= SIM_DT && n < 30) {
      for (const a of S.aircraft) { a.px = a.x; a.py = a.y; a.ph = a.hdg; }
      simStep(SIM_DT); S.acc -= SIM_DT; n++;

    if (n === 30) S.acc = 0; // a slow machine at 8x: drop time rather than fall ever further behind
    if (n) { checkSeparation(); Mission.tick(); }

  const lerp = S.running && !S.paused ? clamp((S.acc || 0) / SIM_DT, 0, 1) : 1, keep = [];
  if (lerp < 1) for (const a of S.aircraft) if (a.px != null) { keep.push([a, a.x, a.y, a.hdg]); a.x = a.px + (a.x - a.px) * lerp; a.y = a.py + (a.y - a.py) * lerp; a.hdg = norm360(a.ph + hdgDiff(a.ph, a.hdg) * lerp); }

  if (window.T3) { try { T3.frame(); } catch (e) { console.error(e); } }
  for (const [a, x, y, h] of keep) { a.x = x; a.y = y; a.hdg = h; }
  uiTimer += dtReal;

    this.hud();
  },
  tick() {
    Ach.check();
    const m = this.cur; if (!m || this.done) return;
    const st = S.stats, broken = m.goals.find(g => g.max && g.get(st) > g.target);
    if (broken) return this.finish(false, `You broke the rule: ${broken.label.toLowerCase()}.`);
    if (m.goals.every(g => g.max || g.get(st) >= g.target)) return this.finish(true);
    if (S.t >= m.min * 60) return this.finish(false, 'The shift ended before the job was done.');
  },
  hud() {
    const el = $('#hud'), m = this.cur;
    if (!m || !S.running) { el.style.display = 'none'; return; }
    el.style.display = '';
    const left = Math.max(0, m.min * 60 - S.t);
    const rows = m.goals.map(g => { const v = g.get(S.stats), ok = g.max ? v <= g.target : v >= g.target; return { ok, html: `<div class="hg${ok ? ' ok' : ''}"><i></i>${g.label}${g.max ? '' : ` <em>${Math.min(v, g.target)}/${g.target}</em>`}</div>` }; });
    el.innerHTML = `<div class="hm"><b>${m.name}</b><span class="hc">${rows.filter(r => r.ok).length}/${rows.length}</span><span class="ht${left < 120 ? ' low' : ''}">${fmtWait(left)}</span></div><div class="hgs">${rows.map(r => r.html).join('')}</div>`;
  },
  finish(win, why) {
    this.done = true; S.paused = true; Radio.clear();
    const m = this.cur, left = m.min * 60 - S.t, P = Profile.d;
    const stars = !win ? 0 : !S.pen && left >= m.min * 15 ? 3 : S.pen <= 1 ? 2 : 1;
    if (stars > (P.stars[m.id] || 0)) P.stars[m.id] = stars;
    P.best[m.id] = Math.max(P.best[m.id] || 0, Math.round(S.score));
    const xp = Math.max(0, Math.round(S.score)) + stars * 200;
    if (!S.xpDone) { S.xpDone = true; XP.add(xp); }
    Profile.save();
    if (win && !S.pen) Ach.give('clean');
    if (MISSIONS.every(x => P.stars[x.id])) Ach.give('career');
    if (window.Career) Career.done(m, win, stars);
    if (win) { Radio.tone(660, 0, 0.14, 0.07); Radio.tone(880, 0.14, 0.14, 0.07); Radio.tone(1320, 0.28, 0.35, 0.07); }
    showResults(win, why, stars, xp);
  },
};

const dialHtml = '<div class="dial" aria-hidden="true"><i style="left:38%;top:30%"></i><i style="left:66%;top:58%"></i><i style="left:27%;top:68%"></i></div>';
function overlay(html) { S.paused = true; const ov = $('#overlay'); ov.classList.remove('hide'); ov.innerHTML = html; ov.scrollTop = 0; return ov; }

function showMenu() {
  const P = Profile.d, got = MISSIONS.reduce((n, m) => n + (P.stars[m.id] || 0), 0);
  overlay(`<div class="modal" role="dialog" aria-labelledby="mTitle">
    <div class="hero"><div><div class="wm">VECTOR</div><h1 id="mTitle">You have the frequency.</h1>
      <p>A voice air traffic control game. Talk to the pilots, keep them apart, and get every one of them home.</p>${rankHtml()}</div>${dialHtml}</div>
    <div class="mainbtns">
      <button data-go="career"><b>Career</b><span>${MISSIONS.length} missions, from your first tower shift to a full airport at rush hour.</span><em>${got} of ${MISSIONS.length * 3} stars</em></button>
      <button data-go="ratings"><b>Ratings</b><span>Checkrides for each position at each airport, like a real controller's endorsements.</span><em>${window.Career ? Career.title() : ''}</em></button>
      <button data-go="board"><b>Leaderboard</b><span>The best shifts from everyone on this server.</span></button>
      <button data-go="mp"><b>Multiplayer</b><span>Work a shift together: one hosts, the others join with a code and take positions.</span></button>
      <button data-go="free"><b>Open shift</b><span>No score, no levels: you, the scope and a frequency full of real crews. Live VATSIM traffic and weather too.</span></button>
      <button data-go="how"><b>How to play</b><span>The calls, the keys and how scoring works.</span></button>
    </div>
    ${window.Crew ? Crew.statusHtml() : ''}
    <p class="sm">${Voice.unavailable() ? 'Voice input: ' + Voice.unavailable() + ' You can still play by tapping “Transmit this call” or typing.' : 'Voice input: ready. The browser asks for the microphone the first time you talk.' + (Voice.touch ? ' On a phone, tap the talk key, speak, and it sends when you pause.' : '')}</p>
    <div><h2>Achievements</h2><div class="achs">${Object.keys(ACH).map(k => `<div class="ach${P.ach[k] ? ' got' : ''}"><b>${ACH[k][0]}</b><span>${ACH[k][1]}</span></div>`).join('')}</div></div>
  </div>`);
  document.querySelectorAll('.mainbtns button').forEach(b => b.onclick = () => ({ career: showCareer, free: showSetup, how: showHow, ratings: () => Career.show(), board: () => Career.board(), mp: () => MP.show() })[b.dataset.go]());
}

function showCareer() {
  const P = Profile.d;
  overlay(`<div class="modal" role="dialog" aria-labelledby="cTitle">
    <div class="hero"><div><div class="wm">CAREER</div><h1 id="cTitle">Pick your shift.</h1><p>Finish a mission to unlock the next. Two stars for one penalty or fewer, three for a clean shift finished with time to spare.</p></div>${dialHtml}</div>
    <div class="mlist">${MISSIONS.map((m, i) => {
      const open = i === 0 || P.stars[MISSIONS[i - 1].id];
      return `<button class="mcard${open ? '' : ' locked'}" data-i="${i}" ${open ? '' : 'disabled'}><span class="mn">${i + 1}</span><span class="mb"><b>${m.name}</b><span>${posList(m)}, ${m.den} traffic, ${m.min} min</span></span><span class="mr">${open ? starStr(P.stars[m.id] || 0) + (P.best[m.id] ? `<em>Best ${P.best[m.id].toLocaleString()}</em>` : '') : '<em>Locked</em>'}</span></button>`;
    }).join('')}</div>
    <div class="foot"><button class="cbtn" id="backBtn">Back to menu</button><span></span></div>
  </div>`);
  $('#backBtn').onclick = () => showMenu();
  document.querySelectorAll('.mcard:not(.locked)').forEach(b => b.onclick = () => showBrief(MISSIONS[+b.dataset.i]));
}

function showBrief(m) {
  overlay(`<div class="modal" role="dialog" aria-labelledby="bTitle">
    <div class="hero"><div><div class="wm">MISSION ${MISSIONS.indexOf(m) + 1}</div><h1 id="bTitle">${m.name}</h1><p>${m.brief}</p></div>${dialHtml}</div>
    <div class="row3"><div><h2>You work</h2><p>${posList(m)}</p></div><div><h2>Traffic</h2><p>${cap(m.den)}${m.emg ? ', with an emergency' : ''}</p></div><div><h2>Time limit</h2><p>${m.min} minutes</p></div></div>
    <div><h2>Objectives</h2><div class="hgs big">${m.goals.map(g => `<div class="hg"><i></i>${g.label}</div>`).join('')}</div></div>
    <div class="foot"><button class="cbtn" id="backBtn">Back</button><button class="go" id="goBtn">Start mission</button></div>
  </div>`);
  $('#backBtn').onclick = () => showCareer();
  $('#goBtn').onclick = () => Mission.start(m);
}

function showHow() {
  overlay(`<div class="modal" role="dialog" aria-labelledby="hTitle">
    <div class="hero"><div><div class="wm">HOW TO PLAY</div><h1 id="hTitle">Callsign first. Then the instruction.</h1><p>Hold the talk key (or Space), say the call, and let go. The pilot reads it back and flies it. If your device has no speech recognition, type the call instead.</p></div>${dialHtml}</div>
    <div class="row3">
      <div><h2>On the ground</h2><p>“cleared to Denver airport…”<br>“push back approved”<br>“runway two seven right, taxi via Alpha”<br>“contact Tower”</p></div>
      <div><h2>At the runway</h2><p>“line up and wait”<br>“runway two seven right, cleared for takeoff”<br>“runway two seven left, cleared to land”<br>“go around”</p></div>
      <div><h2>On radar</h2><p>“turn left heading two four zero”<br>“descend and maintain four thousand”<br>“reduce speed two one zero”<br>“cleared ILS runway two seven left approach”</p></div>
    </div>
    <div class="row3">
      <div><h2>Scoring</h2><p>Answering a waiting pilot correctly scores 10; parked arrivals and handed-off departures score 100. Scores in a row build a streak multiplier up to ×2. Any penalty resets it.</p></div>
      <div><h2>What costs you</h2><p>Loss of separation and runway conflicts cost 300. Go-arounds cost 150. Late handoffs and pilots left waiting drain points.</p></div>
      <div><h2>Keys</h2><p><kbd>Space</kbd> talk, <kbd>Tab</kbd> next aircraft, <kbd>H</kbd> show the phrase, <kbd>P</kbd> pause, <kbd>+</kbd> <kbd>−</kbd> speed, <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> views.</p></div>
    </div>
    <div class="foot"><button class="cbtn" id="backBtn">Back to menu</button><button class="go" id="goBtn">Play the first mission</button></div>
  </div>`);
  $('#backBtn').onclick = () => showMenu();
  $('#goBtn').onclick = () => Mission.start(MISSIONS[0]);
}

function showPause() {
  const m = Mission.cur;
  overlay(`<div class="modal narrow" role="dialog" aria-labelledby="pTitle">
    <div class="hero" style="grid-template-columns:1fr"><div><div class="wm">PAUSED</div><h1 id="pTitle">${m ? m.name : 'Free play'}</h1>${m ? `<div class="hgs big">${m.goals.map(g => { const v = g.get(S.stats), ok = g.max ? v <= g.target : v >= g.target; return `<div class="hg${ok ? ' ok' : ''}"><i></i>${g.label}${g.max ? '' : ` <em>${Math.min(v, g.target)}/${g.target}</em>`}</div>`; }).join('')}</div>` : `<p>Score ${Math.round(S.score).toLocaleString()}</p>`}</div></div>
    <div class="pbtns">
      <button class="go" id="resumeBtn">Resume</button>
      <button class="cbtn" id="restartBtn">Restart</button>
      ${m ? '' : '<button class="cbtn" id="debriefBtn">End session and see the debrief</button>'}
      <button class="cbtn" id="quitBtn">Quit to menu</button>
    </div>
  </div>`);
  $('#resumeBtn').onclick = () => { $('#overlay').classList.add('hide'); S.paused = false; UI.renderTop(); };
  $('#restartBtn').onclick = () => { if (m) Mission.start(m); else startSession(); };
  const d = $('#debriefBtn'); if (d) d.onclick = () => showDebrief();
  $('#quitBtn').onclick = () => { S.running = false; Mission.cur = null; Radio.clear(); showMenu(); };
}

function showResults(win, why, stars, xp) {
  const m = Mission.cur, st = S.stats, i = MISSIONS.indexOf(m), next = win && i >= 0 ? MISSIONS[i + 1] : null;
  overlay(`<div class="modal" role="dialog" aria-labelledby="rTitle">
    <div class="hero"><div><div class="wm">${m.name.toUpperCase()}</div><h1 id="rTitle">${win ? 'Mission complete.' : 'Mission failed.'}</h1>
      <p>${win ? ['', 'Job done. Clean it up for more stars.', 'Solid shift. One clean run with time to spare gets the third star.', 'Perfect shift.'][stars] : why}</p>${rankHtml()}</div>
      <div class="bigstars${win ? '' : ' fail'}">${starStr(stars)}<em>+${xp.toLocaleString()} XP</em></div></div>
    <div class="stats">
      <div class="stat"><span>Score</span><b>${Math.round(S.score).toLocaleString()}</b></div>
      <div class="stat"><span>Takeoffs and landings</span><b>${st.takeoffs} / ${st.landings}</b></div>
      <div class="stat"><span>Losses of separation</span><b style="color:${st.los ? 'var(--bad)' : 'var(--ok)'}">${st.los}</b></div>
      <div class="stat"><span>Go-arounds</span><b>${st.ga}</b></div>
      <div class="stat"><span>Penalties</span><b>${S.pen || 0}</b></div>
      <div class="stat"><span>Calls understood</span><b>${st.tx ? Math.round(st.understood / st.tx * 100) : 0}%</b></div>
      <div class="stat"><span>Time used</span><b>${fmtWait(S.t)}</b></div>
      <div class="stat"><span>Time pilots waited</span><b>${fmtWait(st.delay)}</b></div>
    </div>
    <div class="foot"><span><button class="cbtn" id="careerBtn">Career</button> <button class="cbtn" id="retryBtn">Retry</button> <button class="cbtn" id="replayBtn">Replay and debrief</button></span>${next ? `<button class="go" id="nextBtn">Next: ${next.name}</button>` : win ? '<button class="go" id="careerBtn2">Career complete</button>' : '<button class="go" id="retryBtn2">Try again</button>'}</div>
  </div>`);
  const fin = fn => () => { S.running = false; fn(); };
  const back = m.check && window.Career ? () => Career.show() : showCareer;
  $('#careerBtn').onclick = fin(back); $('#retryBtn').onclick = () => Mission.start(m);
  $('#replayBtn').onclick = () => Replay.open(() => showResults(win, why, stars, xp));
  const n = $('#nextBtn'); if (n) n.onclick = fin(() => showBrief(next));
  const c2 = $('#careerBtn2'); if (c2) c2.onclick = fin(back);
  const r2 = $('#retryBtn2'); if (r2) r2.onclick = () => Mission.start(m);
}
